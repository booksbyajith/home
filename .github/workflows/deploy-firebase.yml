name: Deploy Firebase (rules, indexes, functions)

on:
  workflow_dispatch:
    inputs:
      rules:
        description: Firestore security rules (slips use a private Cloud Storage bucket, no Firebase Storage rules)
        type: boolean
        default: true
      indexes:
        description: Firestore indexes and TTL policies
        type: boolean
        default: true
      functions:
        description: Cloud Functions
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Write functions/.env (non-secret parameters)
        run: |
          {
            echo "SITE_URL=${{ vars.SITE_URL }}"
            echo "ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}"
            echo "STORAGE_BUCKET=${{ vars.STORAGE_BUCKET }}"
          } > functions/.env
      - name: Choose targets
        id: targets
        run: |
          t=""
          if [ "${{ inputs.rules }}" = "true" ]; then t="$t,firestore:rules"; fi
          if [ "${{ inputs.indexes }}" = "true" ]; then t="$t,firestore:indexes"; fi
          if [ "${{ inputs.functions }}" = "true" ]; then t="$t,functions"; fi
          t="${t#,}"
          if [ -z "$t" ]; then echo "Nothing selected"; exit 1; fi
          echo "only=$t" >> "$GITHUB_OUTPUT"
      - name: Deploy
        run: pnpm exec firebase deploy --only "${{ steps.targets.outputs.only }}" --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive --force
      - uses: google-github-actions/setup-gcloud@v2
        if: inputs.functions
      # Callables must be reachable by anyone (each one checks App Check, sign-in and admin
      # rights itself). The Firebase CLI only sets this when a function is first created, so a
      # function whose first deploy failed part-way was left unreachable; set it every time.
      - name: Make callable functions reachable
        if: inputs.functions
        run: |
          for f in $(grep -rhoE 'export const [A-Za-z]+ = onCall' functions/src | awk '{print $3}'); do
            gcloud functions add-invoker-policy-binding "$f" --region=asia-south1 \
              --member=allUsers --project "${{ vars.FIREBASE_PROJECT_ID }}" --quiet >/dev/null
            echo "ok: $f"
          done
